<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graphing Linear Equations | Interactive Review</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#183047;background:#f2f6fb}*{box-sizing:border-box}body{margin:0}header{background:#123a62;color:white;padding:22px max(18px,calc((100vw - 1000px)/2))}header h1{margin:0;font-size:1.6rem}header p{margin:7px 0 0}.wrap{max-width:1000px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;font-weight:700;font-size:1rem}button:focus-visible,input:focus-visible{outline:3px solid #ff9f1c}.tabs button{background:#e0e9f4;color:#123a62}.tabs button.active,.primary{background:#1264a3;color:white}.panel{background:white;border-radius:15px;padding:20px;box-shadow:0 3px 15px #123a6216}.muted{color:#546579}.problem{font-size:1.3rem;font-weight:700;margin:15px 0}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}.secondary{background:#e8eff7;color:#183047}.success{color:#09643a;font-weight:700}.error{color:#a32525;font-weight:700}input[type=number]{font:inherit;width:95px;padding:10px;border:2px solid #b6c6d6;border-radius:8px}label{display:inline-flex;gap:7px;align-items:center}.gridwrap{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}.graph{width:min(100%,420px);touch-action:manipulation;border:1px solid #c8d7e6;border-radius:8px;background:white}.choice{display:block;width:100%;text-align:left;background:#edf3fa;margin:8px 0;color:#183047}.choice.selected{background:#c6e5ff;outline:2px solid #1264a3}.stat{background:#e7f2fb;padding:10px 15px;border-radius:10px}.footer{font-size:.9rem;margin-top:18px;color:#546579} .small{font-size:.93rem} .hint{padding:12px;background:#fff4d9;border-radius:8px} @media(max-width:600px){.panel{padding:14px}.problem{font-size:1.15rem}}</style></head><body><header><h1>2.5 Graphing Linear Equations</h1><p>Interactive, self-paced practice • New questions based on the student activity packet</p></header><main class="wrap"><div class="tabs" id="tabs"></div><section class="panel"><div class="controls"><span class="stat" id="progress"></span><span class="stat" id="score"></span></div><div id="content"></div><div class="controls"><button class="secondary" id="prev">← Previous</button><button class="primary" id="next">Next →</button><button class="secondary" id="reset">Start over</button></div></section><p class="footer">Your answers are saved on this device only. No account or sign-in required. Teacher note: use GitHub Pages to share the link.</p></main><script>
const sections=[
{name:'Slope & intercept',items:[
{type:'pair',eq:'y = 3x + 2',m:3,b:2},{type:'pair',eq:'y = −2x + 5',m:-2,b:5},{type:'pair',eq:'y = ½x − 4',m:.5,b:-4},{type:'pair',eq:'y = −¾x + 1',m:-.75,b:1},{type:'pair',eq:'y = 4',m:0,b:4},{type:'pair',eq:'y = −1.5x − 3',m:-1.5,b:-3}]},
{name:'Graph the line',items:[
{type:'graph',eq:'y = x + 3',m:1,b:3},{type:'graph',eq:'y = −2x + 1',m:-2,b:1},{type:'graph',eq:'y = ½x − 2',m:.5,b:-2},{type:'graph',eq:'y = −⅔x + 4',m:-2/3,b:4},{type:'graph',eq:'y = 3x − 5',m:3,b:-5},{type:'graph',eq:'y = −¼x − 1',m:-.25,b:-1},{type:'graph',eq:'y = 2.5x + 2',m:2.5,b:2},{type:'graph',eq:'y = −x − 4',m:-1,b:-4}]},
{name:'Compare slopes',items:[
{type:'choice',q:'Which line rises from left to right?',choices:['y = −3x + 2','y = 2x − 1','y = −½x + 4'],answer:1,why:'A positive slope rises from left to right.'},
{type:'choice',q:'Which line is the steepest?',choices:['y = ½x + 1','y = −4x + 1','y = 2x + 1'],answer:1,why:'Steepness depends on the absolute value of the slope. |−4| is largest.'},
{type:'choice',q:'Which two lines have the same y-intercept?',choices:['y = 2x + 3 and y = −x + 3','y = x + 2 and y = x + 5','y = −2x + 1 and y = 3x − 1'],answer:0,why:'Both lines cross the y-axis at 3.'},
{type:'choice',q:'What happens when the slope changes from 2 to −2 but the y-intercept stays 1?',choices:['Both lines rise','Both lines cross the y-axis at 1 but tilt in opposite directions','The y-intercept changes'],answer:1,why:'The sign changes the direction; the y-intercept stays fixed.'},
{type:'choice',q:'Which equation represents a horizontal line?',choices:['y = 0x + 6','y = 6x','y = −x + 6'],answer:0,why:'A horizontal line has slope 0.'}]},
{name:'Real-world models',items:[
{type:'choice',q:'Bank A charges $4 monthly plus $2 per out-of-network ATM use. Which equation models the total monthly fee y for x uses?',choices:['y = 4x + 2','y = 2x + 4','y = 6x'],answer:1,why:'The per-use fee is the slope (2); the fixed monthly fee is the intercept (4).'},
{type:'number',q:'Bank B charges $1 monthly plus $3 per out-of-network ATM use. What is the total fee for 4 uses?',answer:13,unit:'dollars',why:'y = 3(4) + 1 = 13.'},
{type:'number',q:'Bank A: y = 2x + 4. Bank B: y = 3x + 1. At how many ATM uses are the fees equal?',answer:3,unit:'uses',why:'Set 2x + 4 = 3x + 1 and solve x = 3.'},
{type:'choice',q:'A job pays $17 per hour plus a one-time $25 bonus. What does the slope mean in y = 17x + 25?',choices:['The $25 bonus','The $17 earned for each hour','The number of hours'],answer:1,why:'Slope is the rate of change: dollars earned per hour.'},
{type:'number',q:'A job pays y = 16x + 30. What is the total pay for 20 hours?',answer:350,unit:'dollars',why:'16(20) + 30 = 350.'},
{type:'choice',q:'Job A: y = 18x. Job B: y = 15x + 60. Which pays more after 10 hours?',choices:['Job A','Job B','They pay the same'],answer:1,why:'Job A = $180; Job B = $210.'},
{type:'number',q:'Job A: y = 18x. Job B: y = 15x + 60. At how many hours is the pay equal?',answer:20,unit:'hours',why:'18x = 15x + 60, so 3x = 60 and x = 20.'},
{type:'choice',q:'For y = 19x + 50, what does the y-intercept represent?',choices:['$19 each hour','$50 paid before any hours are worked','50 hours worked'],answer:1,why:'At x = 0, y = 50, the starting amount.'}]}
];
let s=0,i=0,answers={};try{answers=JSON.parse(localStorage.getItem('linear-review-answers')||'{}')}catch{}let selected=null,points=[];const $=id=>document.getElementById(id),key=()=>s+'-'+i,cur=()=>sections[s].items[i],save=()=>localStorage.setItem('linear-review-answers',JSON.stringify(answers));function completed(){return Object.values(answers).filter(a=>a.correct).length}const total=sections.reduce((a,v)=>a+v.items.length,0);
function render(){selected=null;points=[];const q=cur(),saved=answers[key()];$('tabs').innerHTML=sections.map((v,j)=>`<button class="${j===s?'active':''}" data-tab="${j}">${v.name}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{s=+b.dataset.tab;i=0;render()});$('progress').textContent=`Question ${i+1} of ${sections[s].items.length} • ${sections[s].name}`;$('score').textContent=`Mastered ${completed()} / ${total}`;let html=`<p class="muted">Choose an answer or complete the graph, then select Check answer.</p>`;
if(q.type==='pair')html+=`<div class="problem">Identify the slope and y-intercept of ${q.eq}</div><div class="controls"><label>Slope (m) <input id="slope" type="number" step="any" placeholder="m"></label><label>y-intercept (b) <input id="intercept" type="number" step="any" placeholder="b"></label></div>`;
if(q.type==='choice')html+=`<div class="problem">${q.q}</div>${q.choices.map((c,j)=>`<button class="choice" data-choice="${j}">${String.fromCharCode(65+j)}. ${c}</button>`).join('')}`;
if(q.type==='number')html+=`<div class="problem">${q.q}</div><label>Your answer <input id="numeric" type="number" step="any" placeholder="Answer"> ${q.unit}</label>`;
if(q.type==='graph')html+=`<div class="problem">Graph ${q.eq}</div><p>Tap two points on the coordinate grid to draw your line. Tap a third time to start a new line. Grid: −10 to 10.</p><div class="gridwrap"><canvas class="graph" id="graph" width="420" height="420" aria-label="Interactive coordinate grid from negative ten to ten"></canvas><div class="small"><p><b>Selected points:</b> <span id="coords">None yet</span></p><p>Tip: Start with the y-intercept, then use rise over run.</p><button class="secondary" id="clear">Clear points</button></div></div>`;
html+=`<div class="controls"><button class="primary" id="check">Check answer</button><button class="secondary" id="hint">Show hint</button></div><div id="feedback" aria-live="polite"></div>`;$('content').innerHTML=html;
if(q.type==='choice')document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=+b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',x===b))});
if(q.type==='graph'){$('graph').addEventListener('click',ev=>{let r=ev.target.getBoundingClientRect(),x=Math.round(((ev.clientX-r.left)/r.width*420-210)/19),y=Math.round((210-(ev.clientY-r.top)/r.height*420)/19);x=Math.max(-10,Math.min(10,x));y=Math.max(-10,Math.min(10,y));if(points.length===2)points=[];points.push([x,y]);draw();$('coords').textContent=points.map(p=>`(${p[0]}, ${p[1]})`).join(' and ')||'None yet'});$('clear').onclick=()=>{points=[];draw();$('coords').textContent='None yet'};draw()}
$('hint').onclick=()=>{$('feedback').innerHTML=`<p class="hint">${q.type==='graph'?'Find where the line crosses the y-axis (0, b). Then use the slope as rise ÷ run.':q.type==='pair'?'In y = mx + b, m is the number multiplying x and b is the constant.':q.type==='number'?'Substitute the given value for x, or set the two equations equal if comparing plans.':'Look for the slope (rate of change) and the y-intercept (starting value).'}</p>`};$('check').onclick=check;
if(saved){$('feedback').innerHTML=`<p class="${saved.correct?'success':'error'}">Previous attempt: ${saved.correct?'Correct!':'Try again.'}</p>`}
$('prev').disabled=s===0&&i===0;$('next').textContent=s===sections.length-1&&i===sections[s].items.length-1?'Finish ✓':'Next →';}
function draw(){let c=$('graph');if(!c)return;let ctx=c.getContext('2d'),step=19,toX=x=>210+x*step,toY=y=>210-y*step;ctx.clearRect(0,0,420,420);for(let n=-10;n<=10;n++){ctx.beginPath();ctx.strokeStyle=n===0?'#243b53':'#dce5ed';ctx.lineWidth=n===0?2:1;ctx.moveTo(toX(n),20);ctx.lineTo(toX(n),400);ctx.moveTo(20,toY(n));ctx.lineTo(400,toY(n));ctx.stroke();if(n%2===0&&n!==0){ctx.fillStyle='#637487';ctx.font='11px system-ui';ctx.fillText(n,toX(n)-6,225);ctx.fillText(n,214,toY(n)+4)}}ctx.fillStyle='#243b53';ctx.fillText('x',402,205);ctx.fillText('y',216,17);ctx.fillText('0',214,224);points.forEach(p=>{ctx.beginPath();ctx.fillStyle='#e45a25';ctx.arc(toX(p[0]),toY(p[1]),6,0,Math.PI*2);ctx.fill()});if(points.length===2){let [a,b]=points;ctx.beginPath();ctx.strokeStyle='#e45a25';ctx.lineWidth=3;if(a[0]===b[0]){ctx.moveTo(toX(a[0]),20);ctx.lineTo(toX(a[0]),400)}else{let m=(b[1]-a[1])/(b[0]-a[0]),inter=a[1]-m*a[0];ctx.moveTo(20,toY(m*-10+inter));ctx.lineTo(400,toY(m*10+inter))}ctx.stroke()}}
function check(){let q=cur(),ok=false,attempt='';if(q.type==='pair'){let m=$('slope').value,b=$('intercept').value;if(!m||!b)return feedback('Enter both values.',false);ok=Math.abs(+m-q.m)<.0001&&Math.abs(+b-q.b)<.0001;attempt=`m=${m}, b=${b}`}
if(q.type==='number'){let v=$('numeric').value;if(v==='')return feedback('Enter an answer.',false);ok=Math.abs(+v-q.answer)<.0001;attempt=v}
if(q.type==='choice'){if(selected===null)return feedback('Choose an answer.',false);ok=selected===q.answer;attempt=String(selected)}
if(q.type==='graph'){if(points.length!==2)return feedback('Plot two points first.',false);let [a,b]=points;ok=a[0]!==b[0]&&Math.abs((b[1]-a[1])/(b[0]-a[0])-q.m)<.001&&Math.abs(a[1]-q.m*a[0]-q.b)<.001;attempt=JSON.stringify(points)}
let prior=answers[key()];answers[key()]={correct:ok||(prior&&prior.correct)||false,attempt};save();let explanation=q.type==='pair'?`The slope is ${q.m} and the y-intercept is ${q.b}.`:q.type==='graph'?`The correct line has slope ${q.m} and crosses the y-axis at ${q.b}.`:q.why;feedback((ok?'Correct! Great work. ':'Not quite. Try again. ')+(ok?explanation:''),ok);$('score').textContent=`Mastered ${completed()} / ${total}`}
function feedback(msg,ok){$('feedback').innerHTML=`<p class="${ok?'success':'error'}">${msg}</p>`}
$('prev').onclick=()=>{if(i>0)i--;else if(s>0){s--;i=sections[s].items.length-1}render()};$('next').onclick=()=>{if(i<sections[s].items.length-1)i++;else if(s<sections.length-1){s++;i=0}else{showFinish();return}render()};$('reset').onclick=()=>{if(confirm('Clear all saved progress and start over?')){answers={};save();s=0;i=0;render()}};
function showFinish(){$('content').innerHTML=`<h2>Review complete!</h2><p class="problem">You have mastered ${completed()} of ${total} questions.</p><p>Use the section buttons above to retry any questions. Your progress remains saved on this device.</p>`;$('next').disabled=true}$('next').disabled=false;render();
</script></body></html>
